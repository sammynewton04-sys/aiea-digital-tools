<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="Sefi Digital Studio is temporarily unavailable while its products and customer-delivery process are independently verified.">
  <title>Sefi Digital Studio | Temporarily Unavailable</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #07111f;
      --panel: #0f1d30;
      --border: #29415e;
      --text: #f4f8fc;
      --muted: #b6c5d8;
      --accent: #71d0ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #123052 0, transparent 42%),
        var(--background);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(28px, 7vw, 56px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
    }

    .status {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 16ch;
      margin: 0 0 20px;
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    p { margin: 0; color: var(--muted); }
    p + p { margin-top: 16px; }

    .notice {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--text);
      font-weight: 650;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <p class="status">Customer safety review</p>
    <h1 id="page-title">Sefi Digital Studio is temporarily unavailable.</h1>
    <p>We are verifying each product, customer promise, and delivery step before making anything available.</p>
    <p class="notice">No products are currently offered for sale, and this site will not request payment.</p>
  </main>
</body>
</html>
