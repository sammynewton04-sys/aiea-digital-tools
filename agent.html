<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sefi Agent">
<title>Sefi Digital Studio — Mobile Agent</title>
<style>
  :root {
    --bg: #090d16;
    --surface: #131b2e;
    --surface-hover: #1e293b;
    --primary: #38bdf8;
    --accent: #818cf8;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --border: #1e293b;
    --user-msg: #0284c7;
    --agent-msg: #1e293b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: rgba(19, 27, 46, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: env(safe-area-inset-top, 16px) 16px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #0284c7, #38bdf8);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: white;
    font-size: 14px;
  }
  .brand-info h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .brand-info span {
    font-size: 11px;
    color: #10b981;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .brand-info span::before {
    content: "";
    width: 6px;
    height: 6px;
    background: #10b981;
    border-radius: 50%;
    display: inline-block;
  }
  .quick-chips {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    overflow-x: auto;
    background: rgba(15, 23, 42, 0.6);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .quick-chips::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.2s;
  }
  .chip:active { transform: scale(0.95); background: var(--user-msg); }
  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .message {
    max-width: 86%;
    padding: 12px 15px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
  }
  .user-message {
    align-self: flex-end;
    background: var(--user-msg);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .agent-message {
    align-self: flex-start;
    background: var(--agent-msg);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .agent-message pre {
    background: #090d16;
    padding: 8px 10px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 12px;
  }
  .agent-message code {
    font-family: ui-monospace, Menlo, monospace;
    color: #38bdf8;
  }
  footer {
    padding: 10px 12px env(safe-area-inset-bottom, 14px);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    background: #090d16;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 14px;
    color: white;
    font-size: 15px;
    resize: none;
    max-height: 100px;
    outline: none;
    font-family: inherit;
  }
  textarea:focus { border-color: var(--primary); }
  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--primary);
    border: none;
    color: #090d16;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .send-btn:active { transform: scale(0.92); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">S</div>
    <div class="brand-info">
      <h1>Sefi Agent</h1>
      <span>Mac Studio Online</span>
    </div>
  </div>
</header>

<div class="quick-chips">
  <button class="chip" onclick="quickTask("Check Stripe Sales & Revenue")">📊 Check Revenue</button>
  <button class="chip" onclick="quickTask("Generate 3 new TikTok Hooks for AI Vault")">🎬 3 Video Hooks</button>
  <button class="chip" onclick="quickTask("Check DNS & Website Status")">🌐 Store Status</button>
  <button class="chip" onclick="quickTask("Show Scheduled Content Queue")">📅 Content Queue</button>
</div>

<div id="chat-container">
  <div class="message agent-message">
    👋 <strong>Welcome back, Sefi!</strong><br><br>
    I am connected to your Mac Studio codebase and autonomous execution engine.<br><br>
    You can give me tasks, generate content, check sales, or run any studio automation from your iPhone!
  </div>
</div>

<footer>
  <textarea id="prompt-input" rows="1" placeholder="Give your studio a task..."></textarea>
  <button class="send-btn" onclick="sendMessage()">➤</button>
</footer>

<script>
const input = document.getElementById("prompt-input");
const container = document.getElementById("chat-container");

input.addEventListener("input", function() {
  this.style.height = "auto";
  this.style.height = (this.scrollHeight) + "px";
});

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function quickTask(text) {
  input.value = text;
  sendMessage();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  appendMessage(text, "user-message");
  input.value = "";
  input.style.height = "auto";

  const loadingId = appendMessage("⚡ Processing task on Mac Studio...", "agent-message");

  try {
    const res = await fetch("/api/task", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: text })
    });
    const data = await res.json();
    document.getElementById(loadingId).innerHTML = data.reply;
  } catch (err) {
    document.getElementById(loadingId).innerText = "❌ Error connecting to Mac Studio: " + err.message;
  }
  container.scrollTop = container.scrollHeight;
}

let msgIdCounter = 0;
function appendMessage(html, className) {
  const div = document.createElement("div");
  const id = "msg-" + (++msgIdCounter);
  div.id = id;
  div.className = "message " + className;
  div.innerHTML = html;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return id;
}
</script>
</body>
</html>
